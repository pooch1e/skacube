# Deploy the API to Cloud Run (ADR 0030, docs/deployment.md). Runs on pushes to
# main that change the API or its data. Authenticates with Workload Identity
# Federation: no keys or secrets, only repository variables. Skips until those
# variables exist, so it is safe to merge before the one-time GCP setup.
name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "data/processed/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: skacube-api
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/skacube/api:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-context data=data/processed -t "$IMAGE" api
          docker push "$IMAGE"

      # The new revision gets no traffic until it passes the smoke test below,
      # so a bad build never reaches visitors.
      - name: Deploy a candidate revision
        run: |
          gcloud run deploy "$SERVICE" --image="$IMAGE" --region="$REGION" \
            --service-account="skacube-api-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated --port=3001 --concurrency=16 --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=3 --cpu-boost \
            --no-traffic --tag=candidate --quiet
          CANDIDATE_URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "CANDIDATE_URL=$CANDIDATE_URL" >> "$GITHUB_ENV"

      - name: Smoke test the candidate
        run: |
          curl -fsS --retry 5 --retry-all-errors "$CANDIDATE_URL/health"
          curl -fsS "$CANDIDATE_URL/graphql" -H 'content-type: application/json' \
            -d '{"query":"{ dataset(id: \"eor-h21cm\") { id } }"}' | grep -q '"eor-h21cm"'
          BYTES=$(curl -fsS --compressed "$CANDIDATE_URL/data/volume/eor-h21cm" | wc -c)
          test "$BYTES" -eq 16777216 || { echo "volume decoded to $BYTES bytes"; exit 1; }

      - name: Promote the candidate
        run: gcloud run services update-traffic "$SERVICE" --region="$REGION" --to-latest --quiet
